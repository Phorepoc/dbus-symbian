# package.conf -- how the pdk's package.yml builds this repository's SIS files (release.yml). ".hildon/..." resolves to $PHOREPOC_BUILD/hildon/
# (paths.resolve) and registry/ is merged into core's registry.
# recipes/prebuild.sh builds the archives under $PHOREPOC_BUILD/hildon/, the stack's lower layers first (glib-symbian's recipes/stack_env.sh).
NAME=dbus-symbian
ARCHES="x32"
IMAGE=ghcr.io/phorepoc/web
REPOS_x32="cxxrt glib-symbian gtk-symbian"   # gtk-symbian: expat, which the bus daemon links
# the GLib DLLs first: the D-Bus DLLs link them (their import libraries come from this build)
COMPONENTS_x32="pheglib phegobject phegmodule phegthread phegio phedbus phedbusglib phedbusd phebuscall"
ADDON=0   # (an add-on archive would carry the GLib DLLs too: the package installs on top of glib-symbian's)
