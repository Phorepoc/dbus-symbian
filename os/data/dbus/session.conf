<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- The session bus of this system (phedbusd). Local IPC over TCP on the loopback: there are no unix sockets and no peer credentials, so every client is
     authenticated as ANONYMOUS and the policy below lets any local client talk and own names. The listen address is the one libdbus uses by default
     when DBUS_SESSION_BUS_ADDRESS is not set (the compiled-in tcp:host=127.0.0.1,port=5371). -->
<busconfig>
  <type>session</type>
  <listen>tcp:host=127.0.0.1,port=5371</listen>
  <auth>ANONYMOUS</auth>
  <allow_anonymous/>
  <!-- services the bus starts on demand: one .service file each (Name=, Exec=: the program and its arguments), in a directory relative to this file: libdbus treats only a path starting with / as absolute; the bus starts them with RProcess (phedbus_spawn.c) -->
  <servicedir>services</servicedir>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
  <limit name="max_incoming_bytes">133169152</limit>
  <limit name="max_message_size">33554432</limit>
</busconfig>
